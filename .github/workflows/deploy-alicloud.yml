name: Deploy static site to Alibaba Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: aladincw-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build check and deploy
    runs-on: ubuntu-latest
    env:
      DEPLOY_PORT: ${{ secrets.ALIYUN_PORT || '22' }}
      DEPLOY_TARGET_DIR: ${{ secrets.ALIYUN_TARGET_DIR || '/www/wwwroot/aladincw.cn' }}
      ARCHIVE_NAME: aladincw-site.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run static build check
        run: npm run build

      - name: Create static site archive
        run: |
          tar -czf "$ARCHIVE_NAME" \
            index.html about.html services.html cases.html news.html contact.html \
            en assets favicon.svg robots.txt sitemap.xml vercel.json

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ALIYUN_SSH_KEY }}" > ~/.ssh/alicloud_deploy_key
          chmod 600 ~/.ssh/alicloud_deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload archive to server
        run: |
          scp -P "$DEPLOY_PORT" -i ~/.ssh/alicloud_deploy_key "$ARCHIVE_NAME" \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/tmp/$ARCHIVE_NAME"

      - name: Release files on server
        run: |
          ssh -p "$DEPLOY_PORT" -i ~/.ssh/alicloud_deploy_key \
            "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}" \
            "mkdir -p '$DEPLOY_TARGET_DIR' && rm -rf '$DEPLOY_TARGET_DIR/index.html' '$DEPLOY_TARGET_DIR/about.html' '$DEPLOY_TARGET_DIR/services.html' '$DEPLOY_TARGET_DIR/cases.html' '$DEPLOY_TARGET_DIR/news.html' '$DEPLOY_TARGET_DIR/contact.html' '$DEPLOY_TARGET_DIR/en' '$DEPLOY_TARGET_DIR/assets' '$DEPLOY_TARGET_DIR/favicon.svg' '$DEPLOY_TARGET_DIR/robots.txt' '$DEPLOY_TARGET_DIR/sitemap.xml' '$DEPLOY_TARGET_DIR/vercel.json' && tar -xzf '/tmp/$ARCHIVE_NAME' -C '$DEPLOY_TARGET_DIR' && rm -f '/tmp/$ARCHIVE_NAME'"
